name: Build PixelExperience & Recovery for Galaxy A7 (2018)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build ROM and Recovery
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Build Repo
        uses: actions/checkout@v4

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Setup Build Environment & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib \
            gcc-multilib git gnupg gperf imagemagick lib32readline-dev lib32z1-dev \
            libelf-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev \
            libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc \
            zip zlib1g-dev python-is-python3 tar
          
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

          git config --global user.name "PixelExperience Builder"
          git config --global user.email "builder@pixelexperience.local"

      - name: Initialize PixelExperience 11 Manifest
        run: |
          mkdir -p ~/android/pe && cd ~/android/pe
          repo init -u https://github.com/PixelExperience/manifest -b eleven --depth=1

      - name: Inject Local Manifest & Device Patches
        run: |
          mkdir -p ~/android/pe/.repo/local_manifests
          cp manifests/a7y18lte.xml ~/android/pe/.repo/local_manifests/
          
          cd ~/android/pe
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags --prune

          # Apply PixelExperience product definitions to device tree
          cp ${{ github.workspace }}/patches/aosp_a7y18lte.mk device/samsung/a7y18lte/
          cp ${{ github.workspace }}/patches/AndroidProducts.mk device/samsung/a7y18lte/

      - name: Build Custom Recovery & PixelExperience ROM
        run: |
          cd ~/android/pe
          export USE_CCACHE=1
          export CCACHE_EXEC=/usr/bin/ccache
          ccache -M 30G

          source build/envsetup.sh
          lunch aosp_a7y18lte-userdebug

          # 1. Build Custom Recovery first
          make recoveryimage -j$(nproc --all)
          
          # Package recovery into Samsung Odin .tar format
          cd out/target/product/a7y18lte/
          tar -cvf recovery.tar recovery.img
          cd ~/android/pe

          # 2. Build Flashable ROM Zip
          mka bacon -j$(nproc --all)

      - name: Upload Flashable Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PixelExperience-A7-2018-Build
          path: |
            ~/android/pe/out/target/product/a7y18lte/recovery.tar
            ~/android/pe/out/target/product/a7y18lte/recovery.img
            ~/android/pe/out/target/product/a7y18lte/PixelExperience_*.zip
