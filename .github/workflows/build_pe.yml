name: Build LineageOS 18.1 (with GApps & Gboard) for Galaxy A7 (2018)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build LineageOS & Recovery
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Build Repo
        uses: actions/checkout@v4

      # ── MAXIMUM RUNNER DISK CLEANUP ──────────────────────────────────────
      - name: Free Maximum Disk Space
        run: |
          echo "=== Disk before cleanup ==="
          df -h /

          # Stop and remove Docker completely
          sudo systemctl stop docker 2>/dev/null || true
          sudo rm -rf /var/lib/docker /etc/docker 2>/dev/null || true

          # Remove bulky pre-installed toolchains & runtimes
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /usr/share/swift
          sudo rm -rf /opt/az
          sudo rm -rf /usr/share/miniconda
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/local/share/vcpkg
          sudo rm -rf /usr/local/lib/node_modules

          # Purge unused large packages
          sudo apt-get purge -y azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox powershell 2>/dev/null || true
          sudo apt-get autoremove -y -qq
          sudo apt-get clean

          echo "=== Disk after cleanup ==="
          df -h /

      # ── BUILD DEPENDENCIES ───────────────────────────────────────────────
      - name: Setup Build Environment & Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            bc bison build-essential curl flex g++-multilib \
            gcc-multilib git gnupg gperf imagemagick lib32readline-dev \
            lib32z1-dev libelf-dev liblz4-tool libncurses5 libncurses5-dev \
            libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush \
            rsync schedtool squashfs-tools xsltproc zip zlib1g-dev \
            python-is-python3 tar

          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

          git config --global user.name "LineageOS Builder"
          git config --global user.email "builder@lineageos.local"

      # ── REPO INIT (SHALLOW + EXCLUDE DARWIN TOOLCHAINS) ───────────────────
      - name: Initialize LineageOS 18.1 Manifest
        run: |
          mkdir -p ~/android/lineage && cd ~/android/lineage
          repo init -u https://github.com/LineageOS/android.git \
            -b lineage-18.1 \
            --depth=1 \
            --no-clone-bundle \
            -g default,-darwin

      # ── SYNC (SHALLOW & STREAMLINED) ─────────────────────────────────────
      - name: Inject Local Manifest & Sync Trees
        run: |
          mkdir -p ~/android/lineage/.repo/local_manifests
          cp manifests/a7y18lte.xml ~/android/lineage/.repo/local_manifests/

          cd ~/android/lineage
          repo sync -c -j$(nproc --all) \
            --force-sync \
            --no-clone-bundle \
            --no-tags \
            --depth=1 \
            --prune \
            --optimized-fetch

          echo "=== Disk after sync ==="
          df -h /

          # Inject GApps + Gboard into device makefile
          echo '$(call inherit-product-if-exists, vendor/gapps/gapps.mk)' \
            >> device/samsung/a7y18lte/lineage_a7y18lte.mk

      # ── BUILD ROM & RECOVERY IN SINGLE PASS ──────────────────────────────
      - name: Build LineageOS ROM & Recovery
        run: |
          cd ~/android/lineage

          export ALLOW_MISSING_DEPENDENCIES=true
          export WITH_DEXPREOPT=false          # Skip dex precompile (saves ~3 GB)
          export SKIP_ABI_CHECKS=true
          export BUILD_NUMBER=$(date +%Y%m%d)

          source build/envsetup.sh
          lunch lineage_a7y18lte-userdebug

          echo "=== Disk before build ==="
          df -h /

          # Dynamic disk watchdog: if free disk drops below 15 GB, purge unneeded host debug symbols
          # (symbols/ are unstripped binaries for host debugging; they are NOT used in ROM zip or recovery)
          (
            while true; do
              FREE_KB=$(df -k / | awk 'NR==2 {print $4}')
              if [ "$FREE_KB" -lt 15728640 ]; then
                echo "Disk watchdog: Free space is low (${FREE_KB} KB). Cleaning debug symbols..."
                rm -rf out/target/product/a7y18lte/symbols/* 2>/dev/null || true
              fi
              sleep 45
            done
          ) &
          WATCHDOG_PID=$!

          # Build full LineageOS ROM and Recovery in unified pass
          mka bacon -j$(nproc --all)

          # Stop the watchdog
          kill $WATCHDOG_PID 2>/dev/null || true

          # Package recovery into Samsung Odin .tar format
          cd out/target/product/a7y18lte/
          tar -cvf recovery.tar recovery.img
          cd ~/android/lineage

          echo "=== Disk after build ==="
          df -h /

      # ── UPLOAD ───────────────────────────────────────────────────────────
      - name: Upload Flashable Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LineageOS-18.1-GApps-A7-2018-Build
          path: |
            ~/android/lineage/out/target/product/a7y18lte/recovery.tar
            ~/android/lineage/out/target/product/a7y18lte/recovery.img
            ~/android/lineage/out/target/product/a7y18lte/lineage-*.zip
          if-no-files-found: warn
