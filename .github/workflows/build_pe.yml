name: Build LineageOS 18.1 (with GApps & Gboard) for Galaxy A7 (2018)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build LineageOS & Recovery
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Build Repo
        uses: actions/checkout@v4

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          preinstalled-runtimes: true
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Setup Build Environment & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib \
            gcc-multilib git gnupg gperf imagemagick lib32readline-dev lib32z1-dev \
            libelf-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev \
            libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc \
            zip zlib1g-dev python-is-python3 tar
          
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

          git config --global user.name "LineageOS Builder"
          git config --global user.email "builder@lineageos.local"

      - name: Initialize LineageOS 18.1 Manifest
        run: |
          mkdir -p ~/android/lineage && cd ~/android/lineage
          repo init -u https://github.com/LineageOS/android.git -b lineage-18.1 --depth=1

      - name: Inject Local Manifest & Sync Trees
        run: |
          mkdir -p ~/android/lineage/.repo/local_manifests
          cp manifests/a7y18lte.xml ~/android/lineage/.repo/local_manifests/
          
          cd ~/android/lineage
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags --prune

          # Enable in-tree GApps & Gboard in device makefile
          echo '$(call inherit-product-if-exists, vendor/gapps/gapps.mk)' >> device/samsung/a7y18lte/lineage_a7y18lte.mk

      - name: Build Custom Recovery & LineageOS ROM
        run: |
          cd ~/android/lineage
          export USE_CCACHE=1
          export CCACHE_EXEC=/usr/bin/ccache
          ccache -M 30G

          source build/envsetup.sh
          lunch lineage_a7y18lte-userdebug

          # 1. Build Custom Recovery first
          make recoveryimage -j$(nproc --all)
          
          # Package recovery into Samsung Odin .tar format
          cd out/target/product/a7y18lte/
          tar -cvf recovery.tar recovery.img
          cd ~/android/lineage

          # 2. Build Flashable LineageOS Zip (Includes GApps & Gboard)
          mka bacon -j$(nproc --all)

      - name: Upload Flashable Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LineageOS-18.1-GApps-A7-2018-Build
          path: |
            ~/android/lineage/out/target/product/a7y18lte/recovery.tar
            ~/android/lineage/out/target/product/a7y18lte/recovery.img
            ~/android/lineage/out/target/product/a7y18lte/lineage-*.zip
